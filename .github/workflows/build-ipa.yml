name: Build unsigned iPhone IPA
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        run: xcodegen generate --spec project.yml
      - name: Build unsigned device app
        run: |
          xcodebuild -project CarPlayGPSMonitor.xcodeproj \
            -scheme CarPlayGPSMonitor \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY='' clean build
      - name: Package unsigned IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/CarPlayGPSMonitor.app Payload/
          zip -qry CarPlayGPSMonitor-unsigned.ipa Payload
          unzip -l CarPlayGPSMonitor-unsigned.ipa | head -30
      - uses: actions/upload-artifact@v4
        with:
          name: CarPlayGPSMonitor-unsigned-IPA
          path: CarPlayGPSMonitor-unsigned.ipa
          if-no-files-found: error
